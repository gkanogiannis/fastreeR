name: Sync BioinfoJavaTools Backend JAR

on:
  repository_dispatch:
    types: [backend-release]

jobs:
  update-backend-jar:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.client_payload.version }}

    steps:
      - name: Checkout fastreeR
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Remove existing JARs
        run: rm -f inst/java/*.jar

      - name: Download new JAR from backend release
        run: |
          curl -L -o inst/java/BioInfoJavaUtils-${VERSION}.jar \
            https://github.com/gkanogiannis/BioInfoJava-Utils/releases/download/${VERSION}/BioInfoJavaUtils-${VERSION}.jar

      - name: Download latest JARs for trove and jcommander
        run: |
          mvn dependency:get -Dartifact=net.sf.trove4j:trove4j:3.0.3 -Dtransitive=false -Ddest=./inst/java/
          mvn dependency:get -Dartifact=com.beust:jcommander:1.82 -Dtransitive=false -Ddest=./inst/java/

      - name: Commit changes
        run: |
          git config user.name "Anestis Gkanogiannis"
          git config user.email "ganoyan@gmail.com"
          git ls-files inst/java/*.jar | xargs -r git rm
          git add inst/java/*.jar
          git commit -m "Update backend to version ${VERSION}"
          git tag -a ${VERSION} -m "Synced backend version ${VERSION}"
          git push origin HEAD
          git push origin ${VERSION}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: fastreeR ${{ env.VERSION }}
          body: |
            Auto-synced with BioInfoJavaUtils backend version ${{ env.VERSION }}.
            - New backend JAR: BioInfoJavaUtils-${{ env.VERSION }}.jar
