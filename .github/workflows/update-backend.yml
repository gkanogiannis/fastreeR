name: Sync BioinfoJavaTools Backend JAR

on:
  repository_dispatch:
    types: [backend-release]
  workflow_dispatch:

jobs:
  update-backend-jar:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.client_payload.version }}

    steps:
      - name: Checkout fastreeR
        uses: actions/checkout@v4

      - name: Update DESCRIPTION version
        run: |
          VERSION_CLEAN="${VERSION#v}"
          sed -i "s/^Version: .*/Version: ${VERSION_CLEAN}/" DESCRIPTION

      - name: Prepend new section to NEWS.Rd
        run: |
          VERSION_CLEAN="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%d)
          HEADER="\\\\section{Version ${VERSION_CLEAN} (${DATE})}{\\\\itemize{"
          CHANGE="\\\\item Update backend and CLI"
          FOOTER="}}"

          # Insert block at the top after \encoding
          awk -v header="$HEADER" -v change="$CHANGE" -v footer="$FOOTER" '
            BEGIN { inserted = 0 }
            {
              print
              if (!inserted && /^\\encoding\{/ ) {
                print ""; print header; print change; print footer; print "";
                inserted = 1
              }
            }
          ' inst/NEWS.Rd > inst/NEWS.Rd.new && mv inst/NEWS.Rd.new inst/NEWS.Rd

      - name: Update PyPI setup version
        run: |
          VERSION_CLEAN="${VERSION#v}"
          sed -i "s/^version *= *.*/version = ${VERSION_CLEAN}/" setup.cfg

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Commit changes
        run: |
          VERSION_CLEAN="${VERSION#v}"
          mkdir -p inst/java
          rm -f inst/java/*.jar
          git ls-files inst/java/*.jar | xargs -r git rm
          mvn dependency:copy -Dartifact=net.sf.trove4j:trove4j:3.0.3 -DoutputDirectory=inst/java
          mvn dependency:copy -Dartifact=com.beust:jcommander:1.82 -DoutputDirectory=inst/java
          curl -L -o inst/java/BioInfoJavaUtils-${VERSION_CLEAN}.jar \
            https://github.com/gkanogiannis/BioInfoJava-Utils/releases/download/${VERSION_CLEAN}/BioInfoJavaUtils-${VERSION_CLEAN}.jar
          git config user.name "Anestis Gkanogiannis"
          git config user.email "ganoyan@gmail.com"
          git add DESCRIPTION inst/NEWS.Rd inst/java/*.jar setup.cfg
          git commit -m "Update backend to version ${VERSION_CLEAN}"
          git tag -a ${VERSION_CLEAN} -m "Synced backend version ${VERSION_CLEAN}"
          git push origin HEAD
          git push origin ${VERSION_CLEAN}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.FASTREER_PAT }}
          tag_name: ${{ env.VERSION }}
          name: fastreeR ${{ env.VERSION }}
          body: |
            Auto-synced with BioInfoJavaUtils backend version ${{ env.VERSION }}.
            - New backend JAR: BioInfoJavaUtils-${{ env.VERSION }}.jar
            