name: fastreeR manual release and backend update

on:
  workflow_dispatch:
    inputs:
      fastreer_version:
        description: "fastreeR version to release (x.y.z). Optional. If not provided, DESCRIPTION Version is used."
        required: false
        type: string
      backend_version:
        description: "Backend (BioInfoJavaUtils) version (a.b.c). Optional. If not provided, DESCRIPTION Backend is used."
        required: false
        type: string
      notes:
        description: "Release notes body. Optional. If empty, last commit message is used."
        required: false
        type: string
      dry_run:
        description: "Dry run (yes/no). If 'yes', do NOT push commits or create a GitHub Release."
        required: false
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"

jobs:
  release-and-update-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow committing, tagging, releasing

    steps:
      - name: Checkout fastreeR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags and commit metadata

      - name: Ensure tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      ####################################################################
      # 1. Read current metadata from DESCRIPTION
      ####################################################################
      - name: Parse DESCRIPTION
        id: desc
        run: |
          set -euo pipefail

          # fastreeR version from DESCRIPTION
          CUR_FASTR_VER=$(grep -E '^Version:' DESCRIPTION | head -n1 | sed 's/Version:[[:space:]]*//')
          # backend version from DESCRIPTION (custom field "Backend:")
          CUR_BACKEND_VER=$(grep -E '^Backend:' DESCRIPTION | head -n1 | sed 's/Backend:[[:space:]]*//')

          if [ -z "$CUR_FASTR_VER" ]; then
            echo "ERROR: Could not read Version from DESCRIPTION"
            exit 1
          fi
          if [ -z "$CUR_BACKEND_VER" ]; then
            echo "WARNING: Could not read Backend from DESCRIPTION"
          fi

          echo "fastreeR in DESCRIPTION: $CUR_FASTR_VER"
          echo "Backend in DESCRIPTION:  $CUR_BACKEND_VER"

          # split current DESCRIPTION fastreeR version
          IFS='.' read -r DF_MAJ DF_MIN DF_PATCH <<< "$CUR_FASTR_VER"

          {
            echo "desc_fastreer_version=$CUR_FASTR_VER"
            echo "desc_fast_major=$DF_MAJ"
            echo "desc_fast_minor=$DF_MIN"
            echo "desc_fast_patch=$DF_PATCH"
            echo "desc_backend_version=$CUR_BACKEND_VER"
          } >> "$GITHUB_OUTPUT"

      ####################################################################
      # 2. Resolve requested versions from inputs vs DESCRIPTION defaults
      ####################################################################
      - name: Resolve requested versions and notes
        id: meta
        run: |
          set -euo pipefail

          INPUT_FAST_VER="${{ github.event.inputs.fastreer_version }}"
          INPUT_BACK_VER="${{ github.event.inputs.backend_version }}"
          INPUT_NOTES="${{ github.event.inputs.notes }}"
          INPUT_DRY="${{ github.event.inputs.dry_run }}"
          LAST_COMMIT_MSG=$(git log -1 --pretty=%s)

          # Decide which fastreeR version to propose for release:
          # Rule:
          #   - If provided by user AND major/minor differ from DESCRIPTION -> use user version
          #   - Else fall back to DESCRIPTION version
          #
          # Step 1: parse DESCRIPTION version
          DESC_VER="${{ steps.desc.outputs.desc_fastreer_version }}"
          IFS='.' read -r DESC_MAJ DESC_MIN DESC_PATCH <<< "$DESC_VER"

          if [ -n "$INPUT_FAST_VER" ]; then
            IFS='.' read -r IN_MAJ IN_MIN IN_PATCH <<< "$INPUT_FAST_VER"

            if [ "$IN_MAJ" != "$DESC_MAJ" ] || [ "$IN_MIN" != "$DESC_MIN" ]; then
              FINAL_FAST_VER="$INPUT_FAST_VER"
              echo "Using user-specified fastreeR version $INPUT_FAST_VER (major/minor changed)."
            else
              FINAL_FAST_VER="$DESC_VER"
              echo "User fastreeR version only changed patch or same. Using DESCRIPTION version $DESC_VER."
            fi
          else
            FINAL_FAST_VER="$DESC_VER"
            echo "No user fastreeR version provided. Using DESCRIPTION version $DESC_VER."
          fi

          # Backend jar logic:
          #   - If user provided backend_version AND it's different from DESCRIPTION backend -> use that
          #   - Else use DESCRIPTION backend
          DESC_BACK_VER="${{ steps.desc.outputs.desc_backend_version }}"

          if [ -n "$INPUT_BACK_VER" ] && [ -n "$DESC_BACK_VER" ] && [ "$INPUT_BACK_VER" != "$DESC_BACK_VER" ]; then
            FINAL_BACK_VER="$INPUT_BACK_VER"
            echo "Using user-specified backend version $INPUT_BACK_VER."
          else
            FINAL_BACK_VER="$DESC_BACK_VER"
            echo "Using DESCRIPTION backend version $DESC_BACK_VER."
          fi

          # Release notes priority:
          #   - manual input notes if provided
          #   - else last commit message
          if [ -n "$INPUT_NOTES" ]; then
            FINAL_NOTES="$INPUT_NOTES"
            echo "Using manual notes."
          else
            FINAL_NOTES="$LAST_COMMIT_MSG"
            echo "Using last commit message as notes."
          fi

          # Export split of FINAL_FAST_VER for later release eligibility check
          IFS='.' read -r FIN_MAJ FIN_MIN FIN_PATCH <<< "$FINAL_FAST_VER"

          {
            echo "final_fastreer_version=$FINAL_FAST_VER"
            echo "final_fast_major=$FIN_MAJ"
            echo "final_fast_minor=$FIN_MIN"
            echo "final_fast_patch=$FIN_PATCH"
            echo "final_backend_version=$FINAL_BACK_VER"
            echo "dry_run=$INPUT_DRY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "release_notes<<EOF"
            echo "$FINAL_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show run mode summary
        run: |
          set -euo pipefail

          echo "fastreeR final version:   ${{ steps.meta.outputs.final_fastreer_version }}"
          echo "Backend final version:    ${{ steps.meta.outputs.final_backend_version }}"
          echo "Release notes source:"
          echo "${{ steps.meta.outputs.release_notes }}"
          if [ "${{ steps.meta.outputs.dry_run }}" = "yes" ]; then
            echo "MODE: DRY RUN (no push, no GitHub Release)"
          else
            echo "MODE: LIVE RUN"
          fi

      ####################################################################
      # 3. Download/prepare backend JAR
      #
      # We now have FINAL_BACK_VER (a.b.c). We will:
      #  - download BioInfoJavaUtils-a.b.c.jar from backend repo
      #  - put it in inst/java
      #  - remove older jars
      #
      ####################################################################
      - name: Prepare backend jar
        id: backend
        run: |
          set -euo pipefail
          
          FINAL_BACK_VER=${{ steps.meta.outputs.final_backend_version }}
          REPO_BACKEND="gkanogiannis/BioInfoJava-Utils"

          mkdir -p inst/java

          if [ -z "$FINAL_BACK_VER" ]; then
            echo "No backend version known. Leaving inst/java untouched."
            exit 0
          fi

          echo "Fetching backend $FINAL_BACK_VER from $REPO_BACKEND"

          API_URL_1="https://api.github.com/repos/${REPO_BACKEND}/releases/tags/v${FINAL_BACK_VER}"
          API_URL_2="https://api.github.com/repos/${REPO_BACKEND}/releases/tags/${FINAL_BACK_VER}"

          RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL_1")
          if [ "$(echo "$RESP" | jq -r .message)" = "Not Found" ]; then
            RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL_2")
          fi

          # Safety: make sure we actually got assets back
          ASSET_NAMES=$(echo "$RESP" | jq -r '.assets[].name')
          if [ -z "$ASSET_NAMES" ] || [ "$ASSET_NAMES" = "null" ]; then
            echo "ERROR: No assets found for backend version $FINAL_BACK_VER"
            echo "$RESP" | jq .
            exit 1
          fi

          echo "Cleaning existing jars from inst/java"
          rm -f inst/java/*.jar || true

          echo "$ASSET_NAMES" > /tmp/all_assets.txt

          while read -r NAME; do
            case "$NAME" in
              *.jar)
                # Exclude jars we don't want packaged
                if echo "$NAME" | grep -qiE 'jri|jfreechart|dependencies'; then
                  echo "Skipping $NAME (filtered)"
                  continue
                fi

                DL_URL=$(echo "$RESP" | jq -r --arg NAME "$NAME" '.assets[] | select(.name==$NAME) | .browser_download_url')
                if [ -z "$DL_URL" ] || [ "$DL_URL" = "null" ]; then
                  echo "WARNING: Could not find download URL for $NAME, skipping"
                  continue
                fi

                echo "Downloading $NAME"
                curl -sSL "$DL_URL" -o "inst/java/$NAME"
                ;;
              *)
                # not a jar, ignore
                ;;
            esac
          done < /tmp/all_assets.txt

          echo "Final inst/java contents:"
          ls -l inst/java || true

      ####################################################################
      # 4. Update NEWS.Rd and DESCRIPTION with final versions and notes
      ####################################################################
      - name: Update NEWS.Rd and DESCRIPTION
        run: |
          set -euo pipefail

          FINAL_VER='${{ steps.meta.outputs.final_fastreer_version }}'
          FINAL_BACK='${{ steps.meta.outputs.final_backend_version }}'
          NOTES='${{ steps.meta.outputs.release_notes }}'

          # Update inst/NEWS.Rd

          if [ ! -f inst/NEWS.Rd ]; then
            echo "inst/NEWS.Rd missing, creating new."
            echo "\\name{NEWS}"            >  inst/NEWS.Rd
            echo "\\title{fastreeR NEWS}" >> inst/NEWS.Rd
            echo ""                       >> inst/NEWS.Rd
          fi

          cp inst/NEWS.Rd inst/NEWS.Rd.bak

          {
            echo "\\name{NEWS}"
            echo "\\title{fastreeR NEWS}"
            echo ""
            echo "\\section{fastreeR ${FINAL_VER} with java backend ${FINAL_BACK}}{"
            echo "  * ${NOTES}"
            echo "}"
            echo ""
            tail -n +4 inst/NEWS.Rd.bak || true
          } > inst/NEWS.Rd.new

          mv inst/NEWS.Rd.new inst/NEWS.Rd
          rm inst/NEWS.Rd.bak

          echo "Updated inst/NEWS.Rd for ${FINAL_VER} and backend ${FINAL_BACK}."

          # Update DESCRIPTION

          if [ ! -f DESCRIPTION ]; then
            echo "ERROR: DESCRIPTION not found."
            exit 1
          fi

          cp DESCRIPTION DESCRIPTION.bak

          # Update Version:
          if [ -n "$FINAL_VER" ]; then
            # If Version: exists, replace it. Otherwise append.
            if grep -qE '^Version:' DESCRIPTION.bak; then
              sed -E "s/^Version:.*$/Version: ${FINAL_VER}/" DESCRIPTION.bak > DESCRIPTION.tmp1
            else
              cat DESCRIPTION.bak > DESCRIPTION.tmp1
              echo "Version: ${FINAL_VER}" >> DESCRIPTION.tmp1
            fi
          else
            # No final version? just carry over untouched.
            cat DESCRIPTION.bak > DESCRIPTION.tmp1
          fi

          # Update Backend:
          if [ -n "$FINAL_BACK" ]; then
            if grep -qE '^Backend:' DESCRIPTION.tmp1; then
              sed -E "s/^Backend:.*$/Backend: ${FINAL_BACK}/" DESCRIPTION.tmp1 > DESCRIPTION.tmp2
            else
              cat DESCRIPTION.tmp1 > DESCRIPTION.tmp2
              echo "Backend: ${FINAL_BACK}" >> DESCRIPTION.tmp2
            fi
          else
            # No backend version? keep tmp1 as final.
            cat DESCRIPTION.tmp1 > DESCRIPTION.tmp2
          fi

          mv DESCRIPTION.tmp2 DESCRIPTION
          rm -f DESCRIPTION.tmp1 DESCRIPTION.bak

          echo "Updated DESCRIPTION:"
          echo "  Version:  ${FINAL_VER}"
          echo "  Backend:  ${FINAL_BACK}"

      ####################################################################
      # 5. Update containers, PyPI, Galaxy tools, etc
      ####################################################################
      - name: Update PyPI and Galaxy tools
        run: |
          set -euo pipefail

          FASTREER_VERSION=${{ steps.meta.outputs.final_fastreer_version }}
          BACKEND_VERSION=${{ steps.meta.outputs.final_backend_version }}

          sed -i -E "s/^version *= *.*/version = ${FASTREER_VERSION}/" deploy/fastreer-pypi/setup.cfg

          make galaxy-update-versions FASTREER_VERSION=${FASTREER_VERSION}

      ####################################################################
      # 6. Commit changes (inst/java, inst/NEWS.Rd, DESCRIPTION)
      ####################################################################
      - name: Commit updated files
        run: |
          set -euo pipefail

          if [ "${{ steps.meta.outputs.dry_run }}" = "yes" ]; then
            echo "DRY RUN: Skipping git commit & push."
            exit 0
          fi

          git config user.name "Anestis Gkanogiannis"
          git config user.email "ganoyan@gmail.com"

          git add DESCRIPTION inst/NEWS.Rd inst/java/*.jar deploy/fastreer-pypi/setup.cfg || true
          find deploy/fastreer-galaxy/tools -name '*.xml' -print0 | xargs -0 git add || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            MSG="Prepare release ${{ steps.meta.outputs.final_fastreer_version }} (backend ${{ steps.meta.outputs.final_backend_version }})"
            git commit -m "$MSG"
            git push
          fi

      ####################################################################
      # 7. Get the latest GitHub release to compare major/minor
      ####################################################################
      - name: Get latest release tag
        id: prev
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")
          TAG_NAME=$(echo "$RESP" | jq -r .tag_name)

          if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="0.0.0"
          fi

          TAG_NAME="${TAG_NAME#v}"

          IFS='.' read -r PREV_MAJ PREV_MIN PREV_PATCH <<< "$TAG_NAME"

          {
            echo "previous_version=$TAG_NAME"
            echo "prev_major=$PREV_MAJ"
            echo "prev_minor=$PREV_MIN"
            echo "prev_patch=$PREV_PATCH"
          } >> "$GITHUB_OUTPUT"

      ####################################################################
      # 8. Decide if we *should* create a new GitHub Release.
      #    We compare previous_version vs final_fastreer_version.
      #    Create a release if they differ.
      ####################################################################
      - name: Decide release eligibility
        id: gate
        run: |
          FIN_MAJ=${{ steps.meta.outputs.final_fast_major }}
          FIN_MIN=${{ steps.meta.outputs.final_fast_minor }}
          FIN_PATCH=${{ steps.meta.outputs.final_fast_patch }}
          PREV_MAJ=${{ steps.prev.outputs.prev_major }}
          PREV_MIN=${{ steps.prev.outputs.prev_minor }}
          PREV_PATCH=${{ steps.prev.outputs.prev_patch }}

          NEW="${{ steps.meta.outputs.final_fastreer_version }}"
          OLD="${{ steps.prev.outputs.previous_version }}"

          # strip optional leading 'v' (e.g., v2.3.4 -> 2.3.4)
          NEW="${NEW#v}"
          OLD="${OLD#v}"

          SHOULD_RELEASE="no"
          if [ -z "$OLD" ]; then
            # no previous release found -> release
            SHOULD_RELEASE="yes"
          elif [ "$NEW" != "$OLD" ]; then
            SHOULD_RELEASE="yes"
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Previous release:  $OLD"
          echo "Target fastreeR:   $NEW"
          echo "Should release?:   $SHOULD_RELEASE"

      ####################################################################
      # 9. Stop early if dry-run
      ####################################################################
      - name: Stop if no release needed
        if: steps.gate.outputs.should_release == 'no'
        run: |
          echo "No version change. No GitHub Release will be created."
          exit 0
      - name: Stop if dry run
        if: steps.gate.outputs.should_release == 'yes' && steps.meta.outputs.dry_run == 'yes'
        run: |
          echo "DRY RUN: would have created GitHub Release v${{ steps.meta.outputs.final_fastreer_version }} with backend ${{ steps.meta.outputs.final_backend_version }}."
          echo "Notes:"
          echo "${{ steps.meta.outputs.release_notes }}"
          exit 0

      ####################################################################
      # 10. Create GitHub Release
      #    Tag: <FINAL_FAST_VER>
      #    Body: release_notes (manual or last commit msg)
      #    Attach the backend jar we're shipping.
      ####################################################################
      - name: Create GitHub Release
        if: steps.gate.outputs.should_release == 'yes' && steps.meta.outputs.dry_run != 'yes'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.FASTREER_PAT }}
          tag: ${{ steps.meta.outputs.final_fastreer_version }}
          name: fastreeR ${{ steps.meta.outputs.final_fastreer_version }} (backend ${{ steps.meta.outputs.final_backend_version }})
          body: ${{ steps.meta.outputs.release_notes }}
          draft: false
          prerelease: false
