name: Update bioconda recipe

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "fastreeR version/tag to package for bioconda (e.g. 2.0.0 or v2.0.0). Optional. If empty, use latest release tag."
        required: false
        type: string
      dry_run:
        description: "Dry run (yes/no). If 'yes', do not push."
        required: false
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"

permissions:
  contents: write

jobs:
  bioconda:
    runs-on: ubuntu-latest

    steps:
      ##################################################################
      # 1. Resolve which fastreeR version we're updating bioconda for
      ##################################################################
      - name: Resolve version/tag
        id: resolve
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          INPUT_DRY="${{ github.event.inputs.dry_run || '' }}"
          
          # GITHUB_REF is:
          #   - refs/tags/v1.9.2     when triggered by release
          #   - refs/heads/devel     when manually dispatched from branch 'devel'
          RAW_REF="${GITHUB_REF##*/}"

          CANDIDATE=""

          if [ -n "$INPUT_VERSION" ]; then
            # manual override
            CANDIDATE="$INPUT_VERSION"
            echo "Using user-provided version: $CANDIDATE"
          else
            # if this is a release event, GITHUB_REF will be refs/tags/vX.Y.Z
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              CANDIDATE="$RAW_REF"
              echo "Detected release event tag: $CANDIDATE"
            else
              echo "Manual run with no version provided. Will query latest release tag."
            fi
          fi

          if [ -z "$CANDIDATE" ]; then
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
            RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")
            TAG_NAME=$(echo "$RESP" | jq -r .tag_name)

            if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
              echo "ERROR: Could not determine version: no latest release found."
              exit 1
            fi

            CANDIDATE="$TAG_NAME"
            echo "Using latest release tag from GitHub: $CANDIDATE"
          fi

          CLEANED="${CANDIDATE#v}"

          echo "FINAL git_tag:        $CANDIDATE"
          echo "FINAL version_clean:  $CLEANED"
          echo "Dry run:              ${INPUT_DRY:-no}"

          {
            echo "git_tag=$CANDIDATE"
            echo "version_clean=$CLEANED"
            echo "dry_run=${INPUT_DRY:-no}"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 2. Check out this repo at that exact tag
      # We actually want to UPDATE meta.yaml in the default branch, not
      # mutate an old tag (tags are immutable). So:
      #
      # - First checkout default branch (so we can commit and push).
      # - Then ALSO fetch the tag in a temporary dir just to get the tarball
      #   version/sha info. We'll compute sha256 from the tag.
      #
      ##################################################################
      # FASTREER_PAT needs Contents: read/write on this repo. The checkout
      # persists it, so the later `git push` authenticates with it too.
      - name: Checkout default branch (for committing meta.yaml)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: devel
          token: ${{ secrets.FASTREER_PAT }}

      ##################################################################
      # 3. Download source archive for that version and compute sha256
      #
      # The recipe's source.url is the GitHub autogenerated archive:
      #   https://github.com/<owner>/<repo>/archive/refs/tags/<version>.zip
      #
      # The extension here MUST match the one in meta.yaml, otherwise the
      # sha256 will not match what conda-build downloads.
      ##################################################################
      - name: Fetch and hash source archive
        id: hash
        run: |
          set -euo pipefail

          TAG='${{ steps.resolve.outputs.git_tag }}'

          ARCHIVE_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.zip"

          echo "Downloading archive for tag ${TAG}:"
          echo "  $ARCHIVE_URL"

          mkdir -p /tmp/fastreer-src
          curl -fsSL "$ARCHIVE_URL" -o /tmp/fastreer-src/src.zip

          echo "Computing sha256..."
          SHA256=$(sha256sum /tmp/fastreer-src/src.zip | awk '{print $1}')
          echo "sha256 = $SHA256"

          {
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 4. Patch meta.yaml with version + sha256 (+ reset build number)
      #
      # meta.yaml is expected to start with:
      #   {% set name = "fastreeR" %}
      #   {% set version = "X.Y.Z" %}
      #   {% set sha256 = "..." %}
      ##################################################################
      - name: Update meta.yaml
        run: |
          set -euo pipefail

          VERSION_CLEAN='${{ steps.resolve.outputs.version_clean }}'
          NEW_SHA256='${{ steps.hash.outputs.sha256 }}'
          META_PATH="deploy/fastreer-bioconda/meta.yaml"

          if [ ! -f "$META_PATH" ]; then
            echo "ERROR: $META_PATH not found in this branch."
            exit 1
          fi

          OLD_VERSION=$(sed -nE 's/^\{%[[:space:]]*set[[:space:]]+version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' "$META_PATH")
          echo "Updating version: ${OLD_VERSION:-<none>} -> ${VERSION_CLEAN}"
          echo "Updating sha256 -> ${NEW_SHA256}"

          sed -i -E "s/^\{%[[:space:]]*set[[:space:]]+version[[:space:]]*=.*/{% set version = \"${VERSION_CLEAN}\" %}/" "$META_PATH"
          sed -i -E "s/^\{%[[:space:]]*set[[:space:]]+sha256[[:space:]]*=.*/{% set sha256 = \"${NEW_SHA256}\" %}/" "$META_PATH"

          # New upstream version -> build number starts again at 0
          if [ "$OLD_VERSION" != "$VERSION_CLEAN" ]; then
            sed -i -E "s/^([[:space:]]*number:[[:space:]]*)[0-9]+/\10/" "$META_PATH"
          fi

          grep -q "{% set version = \"${VERSION_CLEAN}\" %}" "$META_PATH" || { echo "ERROR: version not updated"; exit 1; }
          grep -q "{% set sha256 = \"${NEW_SHA256}\" %}" "$META_PATH" || { echo "ERROR: sha256 not updated"; exit 1; }

          echo "Resulting meta.yaml changes:"
          git --no-pager diff -- "$META_PATH"

      ##################################################################
      # 5. Commit and push back to devel (unless dry-run)
      #
      # The actual bioconda-recipes PR is opened by the bioconda autobump
      # bot; this only keeps the in-repo copy of the recipe in sync.
      ##################################################################
      - name: Commit updated bioconda recipe
        run: |
          set -euo pipefail

          if [ '${{ steps.resolve.outputs.dry_run }}' = "yes" ]; then
            echo "DRY RUN: skipping commit & push."
            exit 0
          fi

          VERSION_CLEAN='${{ steps.resolve.outputs.version_clean }}'

          git config user.name "Anestis Gkanogiannis"
          git config user.email "ganoyan@gmail.com"

          git add deploy/fastreer-bioconda/meta.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit (meta.yaml already up to date)."
            exit 0
          fi

          git commit -m "bioconda: bump fastreeR to ${VERSION_CLEAN}"

          # devel may have moved since checkout (other release workflows)
          git pull --rebase origin devel
          git push origin HEAD:devel
