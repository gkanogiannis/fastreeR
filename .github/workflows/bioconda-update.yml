name: Update bioconda recipe

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "fastreeR version/tag to package for bioconda (e.g. 2.0.0 or v2.0.0). Optional. If empty, use latest release tag."
        required: false
        type: string
      dry_run:
        description: "Dry run (yes/no). If 'yes', do not push."
        required: false
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"

permissions:
  contents: write

jobs:
  bioconda:
    runs-on: ubuntu-latest

    steps:
      ##################################################################
      # 1. Resolve which fastreeR version we're updating bioconda for
      ##################################################################
      - name: Resolve version/tag
        id: resolve
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          INPUT_DRY="${{ github.event.inputs.dry_run || '' }}"
          
          # GITHUB_REF is:
          #   - refs/tags/v1.9.2     when triggered by release
          #   - refs/heads/devel     when manually dispatched from branch 'devel'
          RAW_REF="${GITHUB_REF##*/}"

          CANDIDATE=""

          if [ -n "$INPUT_VERSION" ]; then
            # manual override
            CANDIDATE="$INPUT_VERSION"
            echo "Using user-provided version: $CANDIDATE"
          else
            # if this is a release event, GITHUB_REF will be refs/tags/vX.Y.Z
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              CANDIDATE="$RAW_REF"
              echo "Detected release event tag: $CANDIDATE"
            else
              echo "Manual run with no version provided. Will query latest release tag."
            fi
          fi

          if [ -z "$CANDIDATE" ]; then
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
            RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")
            TAG_NAME=$(echo "$RESP" | jq -r .tag_name)

            if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
              echo "ERROR: Could not determine version: no latest release found."
              exit 1
            fi

            CANDIDATE="$TAG_NAME"
            echo "Using latest release tag from GitHub: $CANDIDATE"
          fi

          CLEANED="${CANDIDATE#v}"

          echo "FINAL git_tag:        $CANDIDATE"
          echo "FINAL version_clean:  $CLEANED"
          echo "Dry run:              ${INPUT_DRY:-no}"

          {
            echo "git_tag=$CANDIDATE"
            echo "version_clean=$CLEANED"
            echo "dry_run=${INPUT_DRY:-no}"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 2. Check out this repo at that exact tag
      # We actually want to UPDATE meta.yaml in the default branch, not
      # mutate an old tag (tags are immutable). So:
      #
      # - First checkout default branch (so we can commit and push).
      # - Then ALSO fetch the tag in a temporary dir just to get the tarball
      #   version/sha info. We'll compute sha256 from the tag.
      #
      ##################################################################
      - name: Checkout default branch (for committing meta.yaml)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##################################################################
      # 3. Download source tarball for that version and compute sha256
      #
      # Bioconda recipes usually use the GitHub autogenerated tarball URL:
      #   https://github.com/<owner>/<repo>/archive/refs/tags/<tag>.tar.gz
      #
      # We'll download that for git_tag and hash it.
      ##################################################################
      - name: Fetch and hash source tarball
        id: hash
        run: |
          set -euo pipefail

          TAG='${{ steps.resolve.outputs.git_tag }}'
          CLEAN='${{ steps.resolve.outputs.version_clean }}'

          # Normalize: if tag doesn't start with 'v', bioconda can still use the plain number,
          # but the tarball URL MUST match the actual tag name in git.
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloading tarball for tag ${TAG}:"
          echo "  $TARBALL_URL"

          mkdir -p /tmp/fastreer-src
          curl -sSL "$TARBALL_URL" -o /tmp/fastreer-src/src.tar.gz

          echo "Computing sha256..."
          SHA256=$(sha256sum /tmp/fastreer-src/src.tar.gz | awk '{print $1}')
          echo "sha256 = $SHA256"

          {
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 4. Patch meta.yaml with version + sha256
      #
      # We assume meta.yaml starts with:
      #   {% set name = "fastreeR" %}
      #   {% set version = "2.0.0" %}
      #   {% set sha256 = "..." %}
      ##################################################################
      - name: Update meta.yaml
        run: |
          set -euo pipefail

          VERSION_CLEAN='${{ steps.resolve.outputs.version_clean }}'
          NEW_SHA256='${{ steps.hash.outputs.sha256 }}'

          META_PATH="deploy/fastreer-bioconda/meta.yaml"

          if [ ! -f "$META_PATH" ]; then
            echo "ERROR: $META_PATH not found in this branch."
            exit 1
          fi

          echo "Updating version -> ${VERSION_CLEAN}"
          echo "Updating sha256  -> ${NEW_SHA256}"

          # Replace the Jinja lines in-place
          sed -i -E "s/^\{\%\s*set\s+version\s*=.*/{% set version = \"${VERSION_CLEAN}\" %}/" "$META_PATH"
          sed -i -E "s/^\{\%\s*set\s+sha256\s*=.*/{% set sha256 = \"${NEW_SHA256}\" %}/" "$META_PATH"

          echo "Resulting header of meta.yaml:"
          head -n 5 "$META_PATH"

      ##################################################################
      # 5. Commit and push back to this repo (unless dry-run)
      #
      # We want this change to live in the default branch here so that
      # your "bioconda-recipes sync" repo can just clone fastreeR and see
      # the updated recipe.
      ##################################################################
      - name: Commit updated bioconda recipe
        run: |
          set -euo pipefail

          if [ '${{ steps.resolve.outputs.dry_run }}' = "yes" ]; then
            echo "DRY RUN: skipping commit & push."
            exit 0
          fi

          VERSION_CLEAN='${{ steps.resolve.outputs.version_clean }}'

          git config user.name "Anestis Gkanogiannis"
          git config user.email "ganoyan@gmail.com"

          git add deploy/fastreer-bioconda/meta.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit (meta.yaml already up to date)."
            exit 0
          fi

          COMMIT_MSG="bioconda: bump fastreeR to ${VERSION_CLEAN}"
          git commit -m "$COMMIT_MSG"
          git push

