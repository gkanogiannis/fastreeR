name: Upload to Galaxy Test ToolShed

on:
  #release:
  #  types: [published]
  workflow_dispatch:

jobs:
  upload-test-toolshed:
    name: Upload to Test ToolShed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Planemo
        run: pip install planemo

      - name: Upload tools to Test ToolShed
        env:
          PLANEMO_TOOLSHED_API_KEY: ${{ secrets.GALAXY_TESTSHED_API_KEY }}
        run: |
          make galaxy-update-testshed TOOLSHED_KEY=${PLANEMO_TOOLSHED_API_KEY}
