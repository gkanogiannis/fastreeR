name: Publish fastreeR to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "fastreeR version/tag to publish (e.g. 1.4.0 or v1.4.0). Optional. If empty, uses latest release tag."
        required: false
        type: string
      dry_run:
        description: "Dry run (yes/no). If 'yes', build but DO NOT upload to PyPI."
        required: false
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      ##################################################################
      # 1. Resolve which version/tag we are publishing
      ##################################################################
      - name: Resolve version/tag
        id: resolve
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          INPUT_DRY="${{ github.event.inputs.dry_run || '' }}"

          # GITHUB_REF is:
          #   - refs/tags/v1.9.2     when triggered by release
          #   - refs/heads/devel     when manually dispatched from branch 'devel'
          RAW_REF="${GITHUB_REF##*/}"

          CANDIDATE=""

          if [ -n "$INPUT_VERSION" ]; then
            # manual override always wins
            CANDIDATE="$INPUT_VERSION"
            echo "User provided version: $CANDIDATE"
          else
            # if this is a tag ref (release event), trust it
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              CANDIDATE="$RAW_REF"
              echo "Detected release event tag: $CANDIDATE"
            else
              echo "Manual run with no version provided. Will query latest release from GitHub."
            fi
          fi

          if [ -z "$CANDIDATE" ]; then
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
            RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")
            TAG_NAME=$(echo "$RESP" | jq -r .tag_name)

            if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
              echo "ERROR: Could not determine version: no latest release found."
              exit 1
            fi

            CANDIDATE="$TAG_NAME"
            echo "Latest release tag from GitHub: $CANDIDATE"
          fi

          CLEANED="${CANDIDATE#v}"

          echo "FINAL git_tag:      $CANDIDATE"
          echo "FINAL version_clean $CLEANED"
          echo "Dry run:            ${INPUT_DRY:-no}"

          {
            echo "git_tag=$CANDIDATE"
            echo "version_clean=$CLEANED"
            echo "dry_run=${INPUT_DRY:-no}"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 2. Check out that exact tag so build context matches release
      ##################################################################
      - name: Checkout repository at target version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.git_tag }}
      - name: Validate tag layout
        run: |
          set -euo pipefail
          echo "Checking required paths for PyPI packaging..."
          test -f deploy/fastreer-pypi/setup.cfg || { echo "ERROR: missing deploy/fastreer-pypi/setup.cfg in this tag"; exit 1; }
          test -d inst/java || { echo "ERROR: missing inst/java (no backend jars?) in this tag"; exit 1; }
          test -f fastreeR.py || { echo "ERROR: missing fastreeR.py in this tag"; exit 1; }
          echo "Layout looks good."

      ##################################################################
      # 3. Set up Python build environment
      ##################################################################
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install build deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install build twine

      ##################################################################
      # 4. Patch fastreeR version into deploy/fastreer-pypi before build
      #
      # We want the wheel metadata to match version_clean.
      # We'll inject that into setup.cfg OR pyproject/toml-equivalent *before* build.
      ##################################################################
      - name: Apply version into PyPI package
        run: |
          set -euo pipefail

          TARGET_VERSION='${{ steps.resolve.outputs.version_clean }}'

          echo "Target PyPI package version: $TARGET_VERSION"

          # Update setup.cfg version field to TARGET_VERSION
          sed -i -E "s/^version *= *.*/version = ${TARGET_VERSION}/" deploy/fastreer-pypi/setup.cfg

          echo "After patch:"
          grep -E '^version *= ' deploy/fastreer-pypi/setup.cfg || true

      ##################################################################
      # 5. Build the PyPI artifacts using Makefile
      ##################################################################
      - name: Build Python package (Makefile)
        run: |
          set -euo pipefail
          make pypi-build FASTREER_VERSION='${{ steps.resolve.outputs.version_clean }}'

      ##################################################################
      # 6. Debug build output and jars for sanity
      ##################################################################
      - name: Inspect built dist
        run: |
          set -euo pipefail
          echo "Contents of deploy/fastreer-pypi/dist:"
          ls -l deploy/fastreer-pypi/dist || true

          echo
          echo "Wheel metadata:"
          python -m zipfile --list deploy/fastreer-pypi/dist/*.whl || true

          echo
          echo "Checking copied jars:"
          ls -l deploy/fastreer-pypi/src/fastreer/inst/java || true

      ##################################################################
      # 7. Upload to PyPI (unless dry-run)
      ##################################################################
      - name: Publish to PyPI
        if: steps.resolve.outputs.dry_run != 'yes'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          make pypi-upload FASTREER_VERSION='${{ steps.resolve.outputs.version_clean }}'

      ##################################################################
      # 8. Dry-run summary if we skipped upload
      ##################################################################
      - name: Dry-run summary
        if: steps.resolve.outputs.dry_run == 'yes'
        run: |
          echo "DRY RUN: built fastreer==${{ steps.resolve.outputs.version_clean }} from tag ${{ steps.resolve.outputs.git_tag }}"
          echo "Would have uploaded wheel(s) in deploy/fastreer-pypi/dist to PyPI."
