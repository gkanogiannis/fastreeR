name: Publish fastreeR to Galaxy TestShed and ToolShed

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "fastreeR version/tag to publish (e.g. 1.4.0 or v1.4.0). Optional. If empty, uses latest release tag."
        required: false
        type: string
      dry_run:
        description: "Dry run (yes/no). If 'yes', build but DO NOT upload to PyPI."
        required: false
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      ##################################################################
      # 1. Resolve which version/tag we are publishing
      ##################################################################
      - name: Resolve version/tag
        id: resolve
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          INPUT_DRY="${{ github.event.inputs.dry_run || '' }}"

          # GITHUB_REF is:
          #   - refs/tags/v1.9.2     when triggered by release
          #   - refs/heads/devel     when manually dispatched from branch 'devel'
          RAW_REF="${GITHUB_REF##*/}"

          CANDIDATE=""

          if [ -n "$INPUT_VERSION" ]; then
            # manual override always wins
            CANDIDATE="$INPUT_VERSION"
            echo "User provided version: $CANDIDATE"
          else
            # if this is a tag ref (release event), trust it
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              CANDIDATE="$RAW_REF"
              echo "Detected release event tag: $CANDIDATE"
            else
              echo "Manual run with no version provided. Will query latest release from GitHub."
            fi
          fi

          if [ -z "$CANDIDATE" ]; then
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
            RESP=$(curl -sSL -H "Accept: application/vnd.github+json" "$API_URL")
            TAG_NAME=$(echo "$RESP" | jq -r .tag_name)

            if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
              echo "ERROR: Could not determine version: no latest release found."
              exit 1
            fi

            CANDIDATE="$TAG_NAME"
            echo "Latest release tag from GitHub: $CANDIDATE"
          fi

          CLEANED="${CANDIDATE#v}"

          echo "FINAL git_tag:      $CANDIDATE"
          echo "FINAL version_clean $CLEANED"
          echo "Dry run:            ${INPUT_DRY:-no}"

          {
            echo "git_tag=$CANDIDATE"
            echo "version_clean=$CLEANED"
            echo "dry_run=${INPUT_DRY:-no}"
          } >> "$GITHUB_OUTPUT"

      ##################################################################
      # 2. Check out that exact tag so build context matches release
      ##################################################################
      - name: Checkout repository at target version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.git_tag }}

      ##################################################################
      # 3. Set up Python build environment
      ##################################################################
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Planemo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip 
          pip install planemo

      ##################################################################
      # 4. Patch fastreeR version into Galaxy before build
      ##################################################################
      - name: Apply version into Galaxy tool wrappers
        run: |
          set -euo pipefail

          TARGET_VERSION='${{ steps.resolve.outputs.version_clean }}'

          echo "Target Galaxy package version: $TARGET_VERSION"

          make galaxy-update-versions FASTREER_VERSION=${TARGET_VERSION}

          echo "After patch:"
          grep -E 'version=' deploy/fastreer-galaxy/vcf2tree/fastreer_vcf2tree.xml || true

      ##################################################################
      # 5. Test Galaxy tools before upload
      ##################################################################
      - name: Test Galaxy tools
        run: |
          set -euo pipefail
          make galaxy-test-tools
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastreer-galaxy-test-report
          path: "**galaxy/**/galaxy-test-report.html"
          overwrite: true

      ##################################################################
      # 6. Upload to Galaxy (unless dry-run)
      ##################################################################
      - name: Publish to Galaxy TestShed and ToolShed
        if: steps.resolve.outputs.dry_run != 'yes'
        env:
          PLANEMO_TESTSHED_API_KEY: ${{ secrets.GALAXY_TESTSHED_API_KEY }}
          PLANEMO_TOOLSHED_API_KEY: ${{ secrets.GALAXY_TOOLSHED_API_KEY }}
        run: |
          set -euo pipefail
          #make galaxy-update-testshed TOOLSHED_KEY=${PLANEMO_TESTSHED_API_KEY}
          #make galaxy-update-toolshed TOOLSHED_KEY=${PLANEMO_TOOLSHED_API_KEY}

      ##################################################################
      # 7. Dry-run summary if we skipped upload
      ##################################################################
      - name: Dry-run summary
        if: steps.resolve.outputs.dry_run == 'yes'
        run: |
          echo "DRY RUN: built fastreer==${{ steps.resolve.outputs.version_clean }} from tag ${{ steps.resolve.outputs.git_tag }}"
          echo "Would have uploaded deploy/fastreer-galaxy/tools to Galaxy."
